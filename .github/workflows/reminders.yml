# APT-05: asks the app to send appointment reminders. Lives here rather than in
# Vercel Cron because Vercel's Hobby plan only runs cron jobs once a day. GitHub can
# start a run some minutes late; that's fine, reminders go by what's due, not by
# the exact minute.
#
# Needs in the repository settings: the variable SITE_URL and the secret
# CRON_SECRET (same value as on Vercel). Until SITE_URL is set this does nothing.
name: Appointment reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  send:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send what's due
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/appointment-reminders"
